:root{--bg:#f2f6fc;--card:#fff;--tx:#0f1b3d;--mu:#5b6b8f;--bd:#c9d6ee;--ac:#2f6fd0;--hl:#e8f1fd;--tg:linear-gradient(135deg,#101540,#2f5d9a 70%,#5b8ab5);--tg2:linear-gradient(135deg,#101540,#2f5d9a 70%,#5b8ab5);--g:linear-gradient(135deg,#050a5e,#2f6fd0 65%,#58a6e6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1226;--card:#121b36;--tx:#e8eefc;--mu:#9fb0d6;--bd:#2c3d6b;--ac:#6db3f0;--hl:#1a2a52;--tg:linear-gradient(135deg,#d6eaff,#6db3f0);--tg2:linear-gradient(#a9cdf5,#a9cdf5)}}
:root[data-theme="dark"]{--bg:#0b1226;--card:#121b36;--tx:#e8eefc;--mu:#9fb0d6;--bd:#2c3d6b;--ac:#6db3f0;--hl:#1a2a52;--tg:linear-gradient(135deg,#d6eaff,#6db3f0);--tg2:linear-gradient(#a9cdf5,#a9cdf5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 'IRANYekanX',Tahoma,sans-serif}
:root .lgd{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lgl{display:none}:root:not([data-theme="light"]) .lgd{display:block}}
:root[data-theme="dark"] .lgl{display:none}:root[data-theme="dark"] .lgd{display:block}
main{max-width:720px;margin:0 auto;padding:0 14px 14px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin:10px 0 12px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:9px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--g);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:16px;color:var(--ac)}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:12.5px;color:var(--mu);margin-bottom:3px}
input,select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--ac)}
.gr input:not([type=checkbox]),.gr select{height:44px;line-height:1.3}.gr>div{min-width:0}
.hide{display:none}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big div{background:var(--g);color:#fff;border-radius:14px;padding:12px;text-align:center}
.big small{display:block;font-size:12.5px;opacity:.9}
.big b{font-size:22px;font-weight:800}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ch span{background:var(--hl);color:var(--ac);border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:600}
.sec{border:1.5px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:12px}
.sec h3{margin:0;padding:7px 12px;font-size:14px;background:var(--hl);color:var(--ac);border-bottom:1.5px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 8px;border-top:1px solid var(--bd);text-align:center}
tr:first-child td{border-top:0}
td:first-child{text-align:right;border-left:1px solid var(--bd)}
td:last-child{width:36%}
tr.k td{background:var(--hl);font-weight:800}
.msg{color:var(--mu);text-align:center;padding:8px}
.ft{text-align:center;font-weight:800;font-size:12.5px;color:var(--ac);border:1.5px solid var(--bd);border-radius:12px;background:var(--card);padding:7px 12px;margin:14px 0 4px}.ck{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--tx)}.ck input{width:auto}
.fc{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:9px 14px 12px;margin:16px auto 0;max-width:340px}
.fc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--g)}
.fe{display:flex;flex-direction:column;gap:5px;align-items:center}.fe img{width:142px;display:block}.fe img.r{width:124px}
.fv{width:1.5px;height:38px;background:var(--bd)}.fi{height:46px;width:auto}
.ph{text-align:center;font-weight:700;font-size:14px;color:var(--ac);margin:8px 0 4px}
:root{--nm:#11224d;--sl:#1565c0;--en:#6b7a99}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--nm:#cfe6ff;--sl:#8cc4f5;--en:#7d98c4}}
:root[data-theme="dark"]{--nm:#cfe6ff;--sl:#8cc4f5;--en:#7d98c4}
.hd .top img{height:clamp(84px,27vw,112px);width:auto;order:2}
:root{--hc:#fff;--ln:#b9cdf0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--hc:#121b36;--ln:#2c4a7a}}
:root[data-theme="dark"]{--hc:#121b36;--ln:#2c4a7a}
.hd{--nm:#11224d;--en:#6b7a99;--bd:#c9d6ee;background:#fff;border:1px solid var(--bd);border-radius:20px;box-shadow:0 6px 22px rgba(13,71,161,.10);width:calc(100% - 28px);max-width:692px;margin:11px auto 10px;padding:12px 13px 11px}
.hr{display:flex;align-items:center;justify-content:center;gap:8px}.hr img{height:clamp(63px,20.5vw,78px);width:auto;display:block}.hd img.lgd{display:none!important}.hd img.lgl{display:block!important}
.nw{display:inline-block;flex:none;font-size:clamp(37px,12.3vw,47.5px)}.nw .a{font-size:1em;font-weight:900;line-height:1.1;color:var(--nm)}
.bs{display:flex;justify-content:space-between;direction:ltr;font-size:.26em;font-weight:700;color:var(--nm);margin-top:.45em;line-height:1.3}
.sl{display:flex;align-items:center;gap:10px;margin-top:9px}.sl span{font-size:12.5px;font-weight:500;color:var(--nm);white-space:nowrap}
.sl i{flex:1;height:1.5px}.sl i:first-child{background:linear-gradient(270deg,transparent,var(--bd))}.sl i:last-child{background:linear-gradient(90deg,transparent,var(--bd))}
.en{text-align:center;direction:ltr;font-size:11.5px;font-weight:500;color:var(--en);margin-top:1px}
#splash{position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#2a91ee 0%,#0D47A1 55%,#06286e 100%);display:flex;align-items:center;justify-content:center;animation:spo .5s ease 2.5s forwards}
#splash::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 8%,rgba(255,255,255,.16),transparent 55%)}
.spc{position:relative;display:flex;flex-direction:column;align-items:center;padding-bottom:70px}.spc img{width:150px;margin-bottom:14px}
#splash .nw{font-size:62px}#splash .a,#splash .bs{color:#fff}#splash .bs{font-size:.26em}
.s1{margin-top:26px;font-size:17px;font-weight:500;color:rgba(255,255,255,.92)}.s2{margin-top:3px;font-size:14px;font-weight:500;color:rgba(255,255,255,.7);direction:ltr}
.spb{position:absolute;bottom:88px;left:50%;margin-left:-90px;width:180px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.spb i{display:block;height:100%;width:100%;background:#fff;border-radius:4px;transform-origin:left;transform:scaleX(0);animation:spl 2.5s ease forwards}
@keyframes spl{to{transform:scaleX(1)}}@keyframes spo{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){#splash{animation-delay:1s}.spb i{animation:none;transform:none}}

else{fl=Math.round(P($('mf').value));oc=P($('mo').value);if(!(fl>=1)||!(oc>0)){o.innerHTML='<div class="card msg">تعداد طبقات و سطح اشغال را وارد کنید.</div>';profit();return}}
const door=$('door').value,nu=land*oc/100,lane=+$('lane').value||(fl<=6?1:2),stair=lane===1?25:30;
const bal=w*1.2,con=door==='b'?w*.8:0,n=+$('bs').value;
let bsum=0,bh='';
for(let i=1;i<=n;i++){const bo=Math.min(100,i===1?oc+10:i===2?oc+20:100),a=land*bo/100;bsum+=a;bh+=row(`+ زیرزمین ${F(i)} (سطح اشغال ${F(bo)}%)`,F(a))}
const built=(nu+bal+con)*fl+bsum+nu;
const well=(door==='y'||land>500)?(fl<=7?12:fl<=10?15:fl<=15?20:30):0;
const use=nu-stair-well+bal+con;
const g=(i,d)=>{const v=P($(i).value);return v>=0?v:d};
const pk=g('pk',fl),st=g('st',fl),pa=g('pa',12.5),sa=g('sa',3);
const pks=$('pks').checked,gf=$('gf').checked,gu=gf?nu*.9:0,sell=use*fl+gu+(pks?pk*pa:0)+st*sa;
R={sell,built};
o.innerHTML=`<div class="big"><div><small>متراژ قابل فروش</small><b>${F(sell)}</b></div><div><small>متراژ ساخت</small><b>${F(built)}</b></div></div>
<section class="card"><h2>جزئیات محاسبه</h2><div class="ch">${pz?`<span>${pz}</span>`:''}<span>${F(fl)} طبقه</span><span>سطح اشغال ${F(oc)}%</span><span>${F(n)} زیرزمین</span></div>
${sec('مساحت مفید هر طبقه',row('مساحت غیرمفید هر طبقه',F(nu))+row(`- راه‌پله و آسانسور (${F(lane)} لاین)`,F(stair))+row('- نورگیر',well?F(well):'ندارد')+row('+ بالکن',F(bal))+row('+ کنسول',con?F(con):'ندارد')+row('مساحت مفید هر طبقه',F(use),1))}
${sec('متراژ قابل فروش',row(`مفید × ${F(fl)} طبقه`,F(use*fl))+(gf?row('+ همکف (غیرمفید منهای ۱۰% لابی)',F(gu)):'')+row(`+ پارکینگ (${F(pk)} × ${F(pa)})`,pks?F(pk*pa):'غیرقابل فروش')+row(`+ انباری (${F(st)} × ${F(sa)})`,F(st*sa))+row('متراژ قابل فروش',F(sell),1))}
${sec('متراژ ساخت',row(`(غیرمفید + بالکن + کنسول) × ${F(fl)}`,F((nu+bal+con)*fl))+bh+row('+ همکف',F(nu))+row('متراژ ساخت',F(built),1))}</section>`;
profit()}
function profit(){
const o=$('pout'),pt=P($('pt').value),sp=P($('sp').value),cp=P($('cp').value),bs=$('bp').value,bp=P(bs);
const sale=R&&sp>0?sp*R.sell:0,build=R&&cp>0?cp*R.built:0;
const buy=sale>0&&build>0&&pt>0?(sale-(pt+build))/(pt+build)*100:NaN;
const part=sale>0&&build>0&&bs!==''&&bp>=0&&bp<=100?(sale*bp/100-build)/build*100:NaN;
let r1=row('فروش کل',sale?F(sale):'—')+row('هزینه ساخت کل',build?F(build):'—'),r2=row('قیمت کل ملک کلنگی',pt>0?F(pt):'—')+row('+ هزینه ساخت کل',build?F(build):'—')+row('مجموع هزینه',pt>0&&build?F(pt+build):'—');
o.innerHTML=`<div class="big"><div><small>سود در صورت خرید ملک</small><b>${PC(buy)}</b></div><div><small>سود سازنده در مشارکت</small><b>${PC(part)}</b></div></div>`;$('pdet').innerHTML=`<section class="card"><h2>جزئیات سود</h2>${sec('فروش و ساخت',r1)}${sec('در صورت خرید ملک',r2+row('درصد سود',PC(buy),1))}${sec('در صورت مشارکت',row('سهم سازنده از فروش',sale&&bs!==''&&bp>=0?F(sale*bp/100):'—')+row('هزینه ساخت کل',build?F(build):'—')+row('درصد سود سازنده',PC(part),1))}</section>`}
function syncP(){const land=P($('land').value),a=$('pm'),b=$('pt');
if(last==='pm'){const v=P(a.value);b.value=v>0&&land>0?Math.round(v*land):''}else{const v=P(b.value);a.value=v>0&&land>0?Math.round(v/land):''}}
const link=(a,b)=>$(a).addEventListener('input',()=>{const v=P($(a).value);$(b).value=v>=0&&v<=100?+(100-v).toFixed(2):''});
link('bp','op');link('op','bp');
$('pm').addEventListener('input',()=>{last='pm';syncP()});
$('pt').addEventListener('input',()=>{last='pt';syncP()});
$('land').addEventListener('input',syncP);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.zo').forEach(e=>e.classList.toggle('hide',mode!=='z'));document.querySelectorAll('.mo').forEach(e=>e.classList.toggle('hide',mode!=='m'));calc()});
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',calc));
function inkLR(s,f,d){const c=document.createElement('canvas');c.width=900;c.height=300;const x=c.getContext('2d');x.font=f;x.direction=d;x.fillStyle='#000';const w=x.measureText(s).width,L=450-w/2;x.textAlign=d==='rtl'?'right':'left';x.fillText(s,d==='rtl'?450+w/2:L,200);const q=x.getImageData(0,0,900,300).data;let mn=900,mx=-1;for(let r=0;r<300;r+=2)for(let i=0;i<900;i++)if(q[(r*900+i)*4+3]>40){if(i<mn)mn=i;if(i>mx)mx=i}return{l:mn-L,r:L+w-1-mx}}
function inkV(s,f,d){const c=document.createElement('canvas');c.width=900;c.height=500;const x=c.getContext('2d');x.font=f;x.direction=d;x.fillStyle='#000';const m=x.measureText(s),w=m.width;x.textAlign=d==='rtl'?'right':'left';x.fillText(s,d==='rtl'?450+w/2:450-w/2,300);const q=x.getImageData(0,0,900,500).data;let a=500,b=-1;for(let r=0;r<500;r++)for(let i=0;i<900;i+=2)if(q[(r*900+i)*4+3]>40){if(r<a)a=r;if(r>b)b=r}return{a:300-a,d:b-300,fa:m.fontBoundingBoxAscent||170,fd:m.fontBoundingBoxDescent||60}}
function alignBs(){try{const f1='900 200px IRANYekanX',f2='700 200px IRANYekanX',A=inkLR('بناسنج',f1,'rtl'),B=inkLR('B',f2,'ltr'),J=inkLR('J',f2,'ltr'),VA=inkV('بناسنج',f1,'rtl'),VB=inkV('BJ',f2,'ltr');
document.querySelectorAll('.nw').forEach(n=>{const a=n.querySelector('.a'),b=n.querySelector('.bs'),fa=parseFloat(getComputedStyle(a).fontSize),fb=parseFloat(getComputedStyle(b).fontSize);
b.style.marginLeft=(A.l/200*fa-B.l/200*fb)+'px';b.style.marginRight=(A.r/200*fa-J.r/200*fb)+'px';
const hr=n.closest('.hr');if(!hr)return;const nr=n.getBoundingClientRect(),br=b.getBoundingClientRect(),ar=a.getBoundingClientRect(),sa=fa/200,sb=fb/200;
const baseA=(ar.height-(VA.fa+VA.fd)*sa)/2+VA.fa*sa,baseB=(br.height-(VB.fa+VB.fd)*sb)/2+VB.fa*sb;
const top=ar.top-nr.top+baseA-VA.a*sa,bot=br.top-nr.top+baseB+VB.d*sb,d=(top+bot)/2-nr.height/2;
hr.querySelectorAll('img').forEach(i=>i.style.transform='translateY('+d+'px)')})}catch(e){}}
if(document.fonts)Promise.all([document.fonts.load('900 200px IRANYekanX','بناسنج'),document.fonts.load('700 200px IRANYekanX','BJ')]).then(alignBs);addEventListener('resize',alignBs);
setTimeout(()=>{const s=$('splash');if(s)s.remove()},3100);
calc();
</script>
